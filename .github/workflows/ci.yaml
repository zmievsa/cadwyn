name: CI
on:
  push:
    branches: [main, 3.x.x]
    paths:
      - "**.py"
      - "**.toml"
      - "**.lock"
  pull_request:
    branches: [main, 3.x.x]
    paths:
      - ".github/workflows/ci.yaml" # self
      - ".github/actions/**"
      - "**.py"
      - "**.toml"
      - "**.lock"
      - ".pre-commit-config.yaml"

jobs:
  Tests:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.10"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
      - run: tox run -e py${{ matrix.python-version }}
      - name: Upload coverage results
        uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-latest' # Cross-platform coverage combination doesn't work
        with:
          name: coverage-results-${{ matrix.python-version }}
          path: .coverage*
          include-hidden-files: true
  # The lock pins one FastAPI version, but users get the newest one, and pyproject.toml allows the oldest one.
  # Only FastAPI changes here, so the other dependencies (including ty) stay as locked.
  # Their coverage is combined with the other jobs, so code that only runs on these FastAPI versions counts too.
  FastAPI-bounds:
    name: Tests with ${{ matrix.fastapi }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - fastapi: "fastapi==0.137.1" # Keep in sync with the lower bound in pyproject.toml
            python-version: "3.10"
          - fastapi: "fastapi" # The newest version
            python-version: "3.14"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv lock --upgrade-package "${{ matrix.fastapi }}"
      - run: tox run -e py${{ matrix.python-version }}
      - name: Upload coverage results
        uses: actions/upload-artifact@v6
        with:
          name: coverage-results-fastapi-bounds-${{ matrix.python-version }}
          path: .coverage*
          include-hidden-files: true
  Tutorial-tests:
    runs-on: ubuntu-latest
    name: Tutorial tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install cadwyn with instructions from docs
        run: sh docs_src/quickstart/setup/block001.sh
      - run: |
          pip install uv
          uv pip install --system pytest coverage dirty-equals
          coverage run -m pytest docs_src
      - name: Upload coverage results
        uses: actions/upload-artifact@v6
        with:
          name: coverage-results-docs
          path: .coverage*
          include-hidden-files: true
  Coverage:
    needs: [Tests, FastAPI-bounds, Tutorial-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download coverage info
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-results-*
          merge-multiple: true
          path: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: |
          pip install uv
          uv pip install --system tox tox-uv
          tox run -e coverage_report
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        env:
          fail_ci_if_error: true
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: |
          python -m pip install uv
          uv pip install --system prek
          prek run --all-files
