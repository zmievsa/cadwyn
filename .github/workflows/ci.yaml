name: CI
on:
  push:
    branches: [main, 3.x.x]
  pull_request:
    branches: [main, 3.x.x]

jobs:
  Tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
      - run: tox run -e py${{ matrix.python-version }}
      - name: Upload coverage results
        uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage-results-${{ matrix.python-version }}
          path: .coverage*
          include-hidden-files: true
          retention-days: 7
  Tutorial-tests:
    runs-on: ubuntu-latest
    name: Tutorial tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install uv
      - name: Install cadwyn with instructions from docs
        run: |
          cd "$(mktemp -d)"
          uv init --bare --quiet
          sh "$GITHUB_WORKSPACE/docs_src/quickstart/setup/block001.sh"
      - run: |
          uv pip install --system --reinstall-package cadwyn --reinstall-package cadwyn-core ./cadwyn-core ".[standard]" pytest coverage dirty-equals fastapi-pagination
          coverage run -m pytest docs_src
      - name: Upload coverage results
        uses: actions/upload-artifact@v6
        with:
          name: coverage-results-docs
          path: .coverage*
          include-hidden-files: true
          retention-days: 7
  Standalone-tests:
    runs-on: ubuntu-latest
    name: Standalone tests
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
      - run: tox run -e standalone
  Coverage:
    needs: [Tests, Tutorial-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download coverage info
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-results-*
          merge-multiple: true
          path: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          pip install uv
          uv pip install --system tox tox-uv
          tox run -e coverage_report
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          python -m pip install uv
          uv pip install --system prek
          prek run --all-files

  Docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"
      - run: tox run -e docs

  CI-passed:
    name: CI passed
    if: always()
    needs: [Tests, Tutorial-tests, Standalone-tests, Coverage, Lint, Docs]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
