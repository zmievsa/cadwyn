name: CI
on:
  push:
    branches: [main, 3.x.x]
  pull_request:
    branches: [main, 3.x.x]

jobs:
  Tests:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
      - run: tox run -e py${{ matrix.python-version }}
      - name: Upload coverage results
        uses: actions/upload-artifact@v6
        if: matrix.os == 'ubuntu-latest' # Cross-platform coverage combination doesn't work
        with:
          name: coverage-results-${{ matrix.python-version }}
          path: .coverage*
          include-hidden-files: true
          retention-days: 7
  Tutorial-tests:
    runs-on: ubuntu-latest
    name: Tutorial tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install uv
      - name: Install cadwyn with instructions from docs
        # In a fresh project, like a new user would
        run: |
          cd "$(mktemp -d)"
          uv init --bare --quiet
          sh "$GITHUB_WORKSPACE/docs_src/quickstart/setup/block001.sh"
      - run: |
          # Test the docs against this checkout of Cadwyn instead of its latest release,
          # including the `cadwyn` command that the docs tests run.
          uv pip install --system --reinstall-package cadwyn ".[standard]" pytest coverage dirty-equals fastapi-pagination
          coverage run -m pytest docs_src
      - name: Upload coverage results
        uses: actions/upload-artifact@v6
        with:
          name: coverage-results-docs
          path: .coverage*
          include-hidden-files: true
          retention-days: 7
  Coverage:
    needs: [Tests, Tutorial-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download coverage info
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-results-*
          merge-multiple: true
          path: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          pip install uv
          uv pip install --system tox tox-uv
          tox run -e coverage_report
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        env:
          fail_ci_if_error: true
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          python -m pip install uv
          uv pip install --system prek
          prek run --all-files
