name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main, 3.x.x]
    paths:
      - ".github/workflows/docs.yaml"
      - ".gitignore"
      - ".linkspector.yml"
      - "**.md"
  pull_request:
    branches: [main, 3.x.x]
    paths:
      - ".github/workflows/docs.yaml"
      - ".gitignore"
      - ".linkspector.yml"
      - "**.md"

jobs:
  Validate-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      # Ubuntu 24.04 blocks unprivileged user namespaces, so the Chrome that
      # linkspector starts crashes with "No usable sandbox!".
      - name: Allow Chrome's sandbox
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Validate links
        uses: umbrelladocs/action-linkspector@6c637d70424624231467a4ca918be54fa3b792d0 # v1.5.4
        with:
          reporter: github-check
          filter_mode: ${{ github.event_name == 'pull_request' && 'diff_context' || 'nofilter' }}
          fail_level: any
