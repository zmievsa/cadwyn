[environment]
python-platform = "all"

[analysis]
respect-type-ignore-comments = false
strict-literal-narrowing = true

[rules]
blanket-ignore-comment = "error"
division-by-zero = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
unsupported-dynamic-base = "error"

[[overrides]]
include = ["tests/**"]

[overrides.rules]
missing-type-argument = "ignore"
possibly-missing-attribute = "ignore"
unsupported-base = "ignore"

[[overrides]]
# The how-to examples are small apps that import their own modules
# (`from users import ...`) the way an app run from its own directory does
include = ["docs_src/how_to/change_openapi_schemas/*/*/**"]
exclude = ["docs_src/how_to/change_openapi_schemas/*/tests/**"]

[overrides.rules]
unresolved-import = "ignore"

[[overrides]]
# These doc examples import the modules of an imaginary app (e.g. `from users import User`).
# Their tests register stand-ins for these modules before they import the examples.
include = ["docs_src/concepts/version_changes/block*.py"]

[overrides.rules]
unresolved-import = "ignore"

[[overrides]]
# The changelog page documents the deprecated `hidden()`
include = ["docs_src/concepts/changelogs/block*.py"]

[overrides.rules]
deprecated = "ignore"
