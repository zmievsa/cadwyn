[tox]
envlist =
    coverage_erase
    py{3.14, 3.13, 3.12, 3.11}
    tutorial
    standalone
    coverage_report
    lint
    docs
    links
    build


[testenv]
runner = uv-venv-lock-runner
uv_sync_flags = --reinstall-package=cadwyn-core
with_dev = true
extras =
    standard
package = wheel
wheel_build_env = build_wheel
depends =
    py{3.14, 3.13, 3.12, 3.11}: coverage_erase
set_env =
    PYTHONPATH = {toxinidir}{/}cadwyn-core
    py3.14: TY_PYTHON_VERSION = 3.14
    py3.13: TY_PYTHON_VERSION = 3.13
    py3.12: TY_PYTHON_VERSION = 3.12
    py3.11: TY_PYTHON_VERSION = 3.11
commands_pre =
    py{3.14, 3.13, 3.12, 3.11}: ty check --python-version {env:TY_PYTHON_VERSION}
commands = coverage run -m pytest {posargs}


[testenv:coverage_erase]
base_python = py3.11
package = skip
skip_install = true
commands = coverage erase


[testenv:coverage_report]
base_python = py3.11
package = skip
skip_install = true
depends =
    py{3.14, 3.13, 3.12, 3.11}
    tutorial
commands_pre =
    - coverage combine
commands =
    coverage xml
    coverage report --show-missing


[testenv:tutorial]
base_python = py3.11
depends = coverage_erase
uv_seed = true
allowlist_externals = sh
commands_pre =
    sh -c 'unset UV_PROJECT_ENVIRONMENT VIRTUAL_ENV; cd "$(mktemp -d)" && uv init --bare --quiet && sh "{toxinidir}/docs_src/quickstart/setup/block001.sh"'
commands = coverage run -m pytest docs_src {posargs}


[testenv:standalone]
description = Test cadwyn-core installed on its own, without cadwyn, FastAPI, or Starlette
base_python = py3.11
runner = uv-venv-runner
package = skip
deps = pytest
allowlist_externals = uv
commands_pre = uv pip install --python {envpython} --reinstall-package cadwyn-core {toxinidir}{/}cadwyn-core
set_env =
    PYTHONPATH =
change_dir = {toxinidir}{/}cadwyn-core
commands = pytest tests {posargs}


[testenv:lint]
base_python = py3.11
package = skip
skip_install = true
commands = prek run --all-files

[testenv:docs]
base_python = py3.11
package = skip
skip_install = true
commands = mkdocs build --strict


[testenv:links]
description = Check the links to files and headings in the docs, without network access
base_python = py3.11
package = skip
skip_install = true
allowlist_externals = npm
commands_pre =
    npm ci --prefer-offline --no-audit --fund=false --ignore-scripts
commands =
    npm exec -- linkspector check -c .linkspector.offline.yml


[testenv:links_external]
description = Check every link in the docs, including the links to external sites
base_python = py3.11
package = skip
skip_install = true
allowlist_externals = npm
commands_pre =
    npm ci --prefer-offline --no-audit --fund=false --ignore-scripts
    npm exec -- puppeteer browsers install chrome
commands =
    npm exec -- linkspector check -c .linkspector.yml


[testenv:build]
base_python = py3.11
package = skip
skip_install = true
allowlist_externals = uv
commands = uv build --all-packages
